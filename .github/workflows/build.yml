name: Build Free Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x 

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ Pre-Install Android NDK
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.1.12297006"

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔐 Inject GitHub Secrets into App
        run: |
          echo "EXPO_PUBLIC_GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "EXPO_PUBLIC_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}" >> .env

      - name: 🏗️ Generate Native Android Code
        run: npx expo prebuild --platform android --clean

      - name: 🔑 Grant Gradle Permissions
        working-directory: android
        run: chmod +x ./gradlew

      - name: 🔨 Compile Production APK
        working-directory: android
        run: ./gradlew assembleRelease -Pandroid.injected.signing.store.file=${{ github.workspace }}/bestie.keystore -Pandroid.injected.signing.store.password=bestie123 -Pandroid.injected.signing.key.alias=bestie -Pandroid.injected.signing.key.password=bestie123

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bestie-AI-APK
          path: android/app/build/outputs/apk/release/app-release.apk
